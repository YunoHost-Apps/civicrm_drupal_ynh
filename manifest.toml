#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "civicrm_drupal"
name = "CiviCRM on Drupal"
description.en = "CRM for non-profits, NGOs and advocacy organizations"
description.fr = "CRM pour organisations à but non lucratif et ONG"

version = "2026.07.27~ynh1"

maintainers = ["yalh76"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://civicrm.org"
demo = "https://civicrm.org/demo"
admindoc = "https://docs.civicrm.org/"
userdoc = "https://docs.civicrm.org/"
code = "https://github.com/civicrm/civicrm-drupal-8"
cpe = "cpe:2.3:a:civicrm:civicrm"
fund = "https://civicrm.org/civicrm/contribute/transact?reset=1&id=47"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/drupal"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.install_profil]
    ask.en = "Choose the Drupal install profile to use"
    ask.fr = "Choisissez le profile d'installation de Drupal"
    type = "select"
    choices = ["minimal", "standard"]
    default = "standard"

[resources]

    [resources.sources]

    [resources.sources.main]
    prefetch = false
    url = "https://github.com/civicrm/civicrm-drupal-8/archive/refs/tags/6.17.3.tar.gz"
    sha256 = "b1bf7a18779daf4e0cda569b458eca1d4f5dc5de29452f336b4ac8b57661c239"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "php8.4-fpm",
        "php8.4-cli",
        "php8.4-gd",
        "php8.4-mysql",
        "php8.4-xml",
        "php8.4-ldap",
        "php8.4-mbstring",
        "php8.4-uploadprogress",
        "php8.4-apcu",
        "php8.4-json",
        "php8.4-simplexml",
        "php8.4-curl",
        "php8.4-soap",
        "php8.4-intl",
        "php8.4-zip",
        "php8.4-readline",
        "php8.4-bcmath",
        "php8.4-mbstring",
        "php8.4-fileinfo",
        "php8.4-soap",
        "curl",
        "libzip-dev",
        "mariadb-server",
    ]

    [resources.database]
    type = "mysql"

    [resources.composer]
    version = "2.8.3"
